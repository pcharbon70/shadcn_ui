name: ShadcnUI gallery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SHADCN_UI_BUILD_REVISION: ${{ github.sha }}
      SHADCN_UI_CANONICAL_URL: https://pcharbon70-shadcn-ui-demo.fly.dev/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.3"
          otp-version: "29.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: mix deps.get --locked
      - run: npm ci && npm run assets:check
      - run: mix precommit
      - run: mix docs && mix hex.build && mix run scripts/check-release-archive.exs
      - run: npm ci && npm run assets:build
        working-directory: demo
      - run: mix deps.get --locked && mix precommit
        working-directory: demo
      - run: npm run export:determinism && npm run export:check && npm run export:smoke
        working-directory: demo
      - run: mix spec.check --base origin/main
      - name: Install locked browsers and visual fallback font
        run: |
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install --no-install-recommends -y fonts-noto-core
          fc-cache -f
          fc-match Inter | grep -F "NotoSans-Regular.ttf"
        working-directory: demo
      - run: npm run browser:accordion
      - run: npm run browser:navigation
      - run: npm run browser:phase4
      - run: npm run browser:milestone-b
        working-directory: demo
      - run: npm run browser:milestone-d-phase1
      - run: npm run browser:milestone-d-phase2
      - run: mix run scripts/render-drawer-fixture.exs --check
      - run: npm run browser:milestone-d-phase3
      - run: mix run scripts/render-popover-fixture.exs --check
      - run: npm run browser:milestone-d-phase4
      - run: mix run scripts/render-supplemental-fixture.exs --check
      - run: npm run browser:milestone-d-phase5
      - run: node scripts/record-overlay-capabilities.mjs --check
      - run: npm run capabilities:motion-media:check
      - run: npm run browser:milestone-e-phase1
      - run: mix run scripts/render-carousel-fixture.exs --check
      - run: npm run browser:milestone-e-phase2
      - run: mix run scripts/render-motion-fixture.exs --check
      - run: npm run browser:milestone-e-phase3
      - run: mix run scripts/render-scroll-media-fixture.exs --check
      - run: npm run browser:milestone-e-phase4
      - run: mix run scripts/render-image-gallery-fixture.exs --check
      - run: node scripts/record-gallery-origin.mjs --check
      - run: npm run browser:milestone-e-phase5
      - run: mix run scripts/render-motion-media-budgets.exs --check
      - run: npm run browser:milestone-e-phase6
      - run: npm run browser:milestone-f-phase4
      - run: npm run browser:milestone-g-phase2
      - run: npm run browser:milestone-g-phase3
      - run: npm run browser:milestone-g-phase4
      - run: npm run browser:milestone-g-phase5
      - run: npm run browser:milestone-g-phase5-acceptance
      - run: npm run browser:milestone-g-phase7
      - run: npm run browser:milestone-g-phase8
      - run: npm run browser:milestone-g-remediation-r1
      - run: npm run browser:milestone-g-remediation-r4
      - name: Verify the rendered R5 pinned comparison
        run: |
          npm run reference:milestone-g:check
          npm run browser:milestone-g-remediation-r5
          npm run comparison:milestone-g:check
          npm run integration:milestone-g:check
          npm run manual-risk:milestone-g:check
          npm run regression:milestone-g:check
          npm run deployment:milestone-g:check
          npm run acceptance:milestone-g:check
      - run: npm run browser:milestone-d-gallery
      - run: npm run browser:test
        working-directory: demo
      - run: npm run browser:milestone-c
        working-directory: demo
      - run: npm run export:determinism && npm run export:check && npm run export:smoke
        working-directory: demo
